<style>
:root{
  --bg:#0d1117; --panel:#161b22; --panel2:#1c232c; --line:#2a323d;
  --ink:#e6edf3; --dim:#8b949e; --acc:#4d9fff; --acc2:#1f6feb;
  --sea:#0b1a2b; --land:#242c37; --land-line:#333c49;
  --pick:#2f4f7a; --target:#3b4a5e; --ok:#2ea043; --warn:#d29922; --bad:#f85149;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
input{font:inherit}

#app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding:8px 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5}
.brand{display:flex;align-items:baseline;gap:8px;font-weight:700;letter-spacing:-.01em}
.brand b{font-size:15px}
.brand span{font-size:11px;color:var(--dim);font-weight:500}
.seg{display:flex;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:2px;gap:2px}
.seg button{padding:5px 11px;border-radius:7px;font-size:12.5px;color:var(--dim);white-space:nowrap}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--acc2);color:#fff;font-weight:600}
.spacer{flex:1}
.stats{display:flex;gap:16px;align-items:center;font-variant-numeric:tabular-nums}
.stat{text-align:right;line-height:1.1}
.stat u{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);text-decoration:none}
.stat b{font-size:16px;font-weight:650}
.btn{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);
  font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--acc);color:var(--acc)}
.btn.primary{background:var(--acc2);border-color:var(--acc2);color:#fff;font-weight:600}
.btn.primary:hover{background:#3b82f6;color:#fff}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn[aria-pressed="true"]{border-color:var(--acc);color:var(--acc);background:rgba(77,159,255,.12)}

body.play .only-select{display:none!important}
body.select .only-play{display:none!important}

/* ---------- carte ---------- */
#stage{position:relative;flex:1;min-height:0;background:var(--sea);overflow:hidden}
svg#map{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
svg#map.dragging{cursor:grabbing}
path.c{fill:var(--land);stroke:var(--land-line);stroke-width:.7;vector-effect:non-scaling-stroke;
  transition:fill .15s}
path.c.sel{fill:var(--pick);stroke:#7ea8dd}
body.select path.c.can{cursor:pointer}
body.select path.c.can:hover{fill:#35414f}
body.select path.c.sel:hover{fill:#3a5f92}
path.c.live{fill:var(--target);stroke:#66748a}
body.play #targets.pickable path.c.live{cursor:pointer}
body.play #targets.pickable path.c.live:hover{fill:#53657f}
path.c.ask{fill:var(--acc);stroke:#cfe4ff;stroke-width:1.6}
path.c.ok{fill:var(--ok);stroke:#7ee2a8}
path.c.half{fill:var(--warn);stroke:#f0d48a}
path.c.bad{fill:var(--bad);stroke:#ffb3ad}
path.c.flash{animation:fl .5s ease-out 2}
@keyframes fl{0%,100%{fill:var(--bad)}50%{fill:#ff9b95}}
circle.mk{fill:none;stroke:#7f8ea3;stroke-width:1.1;vector-effect:non-scaling-stroke;pointer-events:none}
circle.mk.hid{display:none}
circle.mk.on{stroke:#8fbaf0}
circle.hit{fill:transparent;stroke:none}
body.select circle.hit.can,body.play #targets.pickable circle.hit.live{cursor:pointer}
text.lbl{fill:#dbe6f2;font-weight:600;text-anchor:middle;paint-order:stroke;
  stroke:#0b1a2b;stroke-linejoin:round;pointer-events:none}

#zoomer{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px}
#zoomer button{width:34px;height:34px;border:1px solid var(--line);border-radius:9px;
  background:rgba(22,27,34,.92);font-size:16px;line-height:1;backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px)}
#zoomer button:hover{border-color:var(--acc);color:var(--acc)}
#zoomer button.sm{font-size:11px}
#tip{position:absolute;pointer-events:none;background:rgba(13,17,23,.94);border:1px solid var(--line);
  border-radius:7px;padding:4px 8px;font-size:12.5px;white-space:nowrap;display:none;z-index:6;
  transform:translate(-50%,-140%)}
#tip b{font-weight:600}
#tip i{font-style:normal;color:var(--dim)}

/* ---------- panneau bas ---------- */
#panel{background:var(--panel);border-top:1px solid var(--line);padding:10px 14px;z-index:4}
.wrap{max-width:1100px;margin:0 auto}
.picks{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.picks .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-right:2px}
.selrow{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap}
.search{position:relative;flex:1;min-width:190px}
.search input{width:100%;padding:7px 11px;border:1px solid var(--line);border-radius:9px;
  background:#0d1117;color:var(--ink);font-size:13px;outline:none}
.search input:focus{border-color:var(--acc)}
#hits{position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--panel2);
  border:1px solid var(--line);border-radius:10px;overflow:hidden;display:none;z-index:9;
  box-shadow:0 -8px 24px rgba(0,0,0,.45)}
#hits button{display:flex;width:100%;align-items:center;gap:8px;padding:7px 11px;font-size:13px;text-align:left}
#hits button:hover,#hits button.cur{background:rgba(77,159,255,.16)}
#hits .fg{font-size:16px}
#hits .st{margin-left:auto;font-size:11px;color:var(--dim)}
.count{font-variant-numeric:tabular-nums;font-size:13px;color:var(--dim)}
.count b{color:var(--ink);font-size:15px;font-weight:650}

.pwrap{display:flex;align-items:center;gap:16px;min-height:62px}
.ask-lead{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--dim)}
.ask-main{font-size:26px;font-weight:700;letter-spacing:-.02em;line-height:1.15}
.ask-main .flag{font-size:40px;line-height:1}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;flex:1}
.choice{display:flex;align-items:center;gap:9px;padding:10px 12px;border:1px solid var(--line);
  border-radius:10px;background:var(--panel2);text-align:left;font-size:14px;transition:.12s}
.choice:hover{border-color:var(--acc)}
.choice kbd{font:600 10px/1 ui-monospace,Menlo,monospace;color:var(--dim);border:1px solid var(--line);
  border-radius:4px;padding:3px 5px;background:#0d1117}
.choice.good{background:rgba(46,160,67,.18);border-color:var(--ok)}
.choice.wrong{background:rgba(248,81,73,.16);border-color:var(--bad)}
.choice .fg{font-size:20px}
#feedback{min-height:18px;font-size:13px;font-weight:600;text-align:center;margin-top:8px}
#feedback.ok{color:#56d364}#feedback.bad{color:#ff7b72}#feedback.warn{color:#e3b341}
.bar{height:3px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);transition:width .25s}

/* ---------- overlay ---------- */
#ov{position:absolute;inset:0;background:rgba(6,9,13,.9);backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);display:none;align-items:center;justify-content:center;z-index:20;padding:20px}
#ov.on{display:flex}
.card{width:min(560px,100%);max-height:86vh;overflow:auto;background:var(--panel);
  border:1px solid var(--line);border-radius:16px;padding:22px}
.card h2{margin:0 0 4px;font-size:22px;letter-spacing:-.02em}
.card p.sub{margin:0 0 16px;color:var(--dim);font-size:13px}
.score-big{font-size:46px;font-weight:750;letter-spacing:-.03em}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:11px}
.kpi u{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--dim);text-decoration:none}
.kpi b{font-size:19px;font-variant-numeric:tabular-nums}
.miss{margin:14px 0 0;border-top:1px solid var(--line);padding-top:12px}
.miss h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim)}
.miss ul{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.miss li{background:rgba(248,81,73,.13);border:1px solid rgba(248,81,73,.35);color:#ffb3ad;
  padding:4px 9px;border-radius:7px;font-size:12.5px}
.row{display:flex;gap:9px;flex-wrap:wrap;margin-top:18px}
.note{font-size:11.5px;color:var(--dim);margin-top:14px;line-height:1.5}

@media (max-width:820px){
  header{gap:8px;padding:7px 10px}
  .brand span{display:none}
  .seg button{padding:5px 8px;font-size:11.5px}
  .stats{gap:11px}
  .pwrap{flex-direction:column;align-items:stretch;gap:10px}
  .ask-main{font-size:21px;text-align:center}
  .choices{grid-template-columns:1fr}
  .choice kbd{display:none}
  .picks{gap:5px}
  .btn.sm{padding:4px 7px;font-size:11.5px}
}

/* --- accessibilité : focus clavier visible (WCAG 2.4.7) --- */
:focus-visible{outline:2px solid var(--acc);outline-offset:2px;border-radius:6px}
.search input:focus-visible{outline-offset:0}
#hits button:focus-visible{outline-offset:-2px}
path.c:focus{outline:none}
path.c:focus-visible{outline:none;stroke:#fff;stroke-width:2.5px;stroke-dasharray:5 3;paint-order:stroke}

/* --- mouvement réduit --- */
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms!important;animation-duration:.01ms!important;
    animation-iteration-count:1!important;scroll-behavior:auto!important}
}

/* --- saisie libre --- */
.typing{display:flex;gap:8px;align-items:center;flex:1;min-width:210px}
.typing input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--line);border-radius:10px;
  background:#0d1117;color:var(--ink);font-size:15px;outline:none}
.typing input:focus{border-color:var(--acc)}
.typing input.good{border-color:var(--ok)}
.typing input.wrong{border-color:var(--bad)}
.typing .hintbox{font-size:12px;color:var(--dim);white-space:nowrap}

/* --- chrono d'examen --- */
.exam{display:none;height:3px;background:var(--panel2);border-radius:3px;overflow:hidden;margin-top:6px}
.exam.on{display:block}
.exam i{display:block;height:100%;background:var(--warn);width:100%}

/* --- barre d'options de l'écran de sélection --- */
.opts{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px}
.opts .lab{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--dim);margin-right:2px}

/* --- fiche de fin : progression --- */
.lvl{display:inline-flex;gap:3px;align-items:center}
.lvl i{width:9px;height:5px;border-radius:3px;background:var(--line)}
.lvl i.on{background:var(--ok)}
.miss li.up{background:rgba(46,160,67,.13);border-color:rgba(46,160,67,.35);color:#7ee787}
.miss li.st{display:inline-flex;align-items:center;gap:7px;background:var(--panel2);
  border-color:var(--line);color:var(--ink)}
.miss ul.scroll{max-height:220px;overflow:auto;align-content:flex-start}
.tally{font-size:11px;color:var(--dim);font-variant-numeric:tabular-nums}

/* --- très petits écrans --- */
@media (max-width:480px){
  header{flex-wrap:wrap;row-gap:7px;padding:6px 8px}
  .spacer{display:none}          /* sinon il pousse la marque à droite une fois l'en-tête sur 2 lignes */
  .brand{order:1;margin-right:auto}
  .brand b{font-size:15px}
  .seg{order:3;width:100%;overflow-x:auto;scrollbar-width:none}
  .seg::-webkit-scrollbar{display:none}
  .stats{order:2;margin-left:auto;gap:9px}
  .stat b{font-size:14px}
  .btn.only-play{order:2;padding:5px 9px;font-size:12px}
  #bEdit{font-size:0;padding:5px 9px}
  #bEdit::after{content:'✏️';font-size:13px}
  #panel{padding:9px 10px}
  .ask-main{font-size:19px}
  .card{padding:18px 16px}
  .grid3{grid-template-columns:1fr;gap:7px}
}
</style>
</head>

          <button class="btn sm" data-add="Europe">Europe</button>
          <button class="btn sm" data-add="Océanie">Océanie</button>
          <button class="btn sm" data-add="trans">Transcont.</button>
          <button class="btn sm" data-add="all">Tout le monde</button>
          <span style="width:8px"></span>
          <button class="btn sm" id="bList39">Ma liste (39)</button>
          <button class="btn sm" id="bWeak" title="Sélectionner les pays que tu rates le plus souvent">⚠ Mes points faibles</button>

          <button class="btn sm" id="bTerr" aria-pressed="false" title="Rendre sélectionnables les territoires et dépendances">Territoires</button>

        <div class="opts">
          <span class="lab">Options</span>
          <button class="btn sm" id="bSmart" aria-pressed="false" title="Fait revenir plus souvent les pays mal maîtrisés (répétition espacée)">🧠 Révision intelligente</button>
          <button class="btn sm" id="bType" aria-pressed="false" title="Écrire la réponse au clavier au lieu de choisir parmi 4 propositions">⌨ Saisie libre</button>
          <button class="btn sm" id="bExam" aria-pressed="false" title="10 secondes par question, aucune seconde tentative">⏱ Mode examen</button>
          <button class="btn sm" id="bStats" title="Voir ma progression pays par pays">📊 Ma progression</button>
        </div>
        <div class="selrow">
          <div class="search">
            <input id="q" type="text" placeholder="Chercher un pays… (Entrée = ajouter / retirer)" autocomplete="off" spellcheck="false">
            <div id="hits"></div>
          </div>
          <div class="count"><b id="nSel">0</b> pays sélectionné<span id="nS"></span></div>
          <button class="btn primary" id="bGo">Commencer</button>
        </div>
      </div>
      <div class="only-play">
        <div class="pwrap" id="pwrap"></div>
        <div id="feedback" role="status" aria-live="polite" aria-atomic="true"></div>
        <div class="bar"><i id="pbar" style="width:0%"></i></div>
        <div class="exam"><i id="ebar"></i></div>
      </div>
    </div>
  </div>
</div>

/* ================= données ================= */
const flag=cc=>cc.replace(/./g,c=>String.fromCodePoint(127397+c.charCodeAt(0)));
const norm=s=>s.normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const PAYS=PAYS_RAW.map(([id,nom,iso2,cap,cont,sov,trans])=>
  ({id,nom,iso2,cap,cont,sov:!!sov,trans:!!trans,fg:flag(iso2),q:norm(nom)}));
const BY={}; PAYS.forEach(p=>BY[p.id]=p);
const MODE_NOM={place:'Trouver sur la carte',name:'Reconnaître le pays',flag:'Drapeaux',
  capital:'Capitales',flagcap:'Drapeau → capitale',cont:'Continents'};

/* ================= carte ================= */
const NS='http://www.w3.org/2000/svg';
const SVG=document.getElementById('map');
const gCtx=document.getElementById('ctx'),gTgt=document.getElementById('targets'),
      gMk=document.getElementById('marks'),gLb=document.getElementById('labels'),
      TIP=document.getElementById('tip');
const node={},hitNode={},mkNode={},geo={};
const DIAG=id=>{const b=MAP.countries[id].b;return Math.hypot(b[2]-b[0],b[3]-b[1]);};

const ents=Object.entries(MAP.countries).sort((a,b)=>
  ((BY[a[0]]?1:0)-(BY[b[0]]?1:0)) || (DIAG(b[0])-DIAG(a[0])));   /* petits pays au-dessus */
for(const [id,c] of ents){
  const p=document.createElementNS(NS,'path'); p.setAttribute('d',c.d);
  if(BY[id]){ p.setAttribute('class','c'); p.dataset.id=id; gTgt.appendChild(p); node[id]=p; geo[id]=c; }
  else { p.setAttribute('class','c'); gCtx.appendChild(p); }
}
const TINY={};
for(const id in geo){
  if((MAP.countries[id].s||DIAG(id))>=20) continue;
  TINY[id]=1;
  const m=document.createElementNS(NS,'circle');
  m.setAttribute('cx',geo[id].c[0]); m.setAttribute('cy',geo[id].c[1]); m.setAttribute('class','mk');
  gMk.appendChild(m); mkNode[id]=m;
  const h=document.createElementNS(NS,'circle');
  h.setAttribute('cx',geo[id].c[0]); h.setAttribute('cy',geo[id].c[1]); h.setAttribute('class','hit');
  h.dataset.id=id; gTgt.appendChild(h); hitNode[id]=h;
}

/* --------- vue (zoom / déplacement) --------- */
let vb={x:0,y:0,w:MAP.w,h:MAP.h};
const scale=()=>{const m=SVG.getScreenCTM();return m&&m.a?m.a:1;};
function applyVB(){
  if(!isFinite(vb.x)||!isFinite(vb.y)||!isFinite(vb.w)||!isFinite(vb.h)||vb.w<=0||vb.h<=0)
    vb={x:0,y:0,w:MAP.w,h:MAP.h};
  SVG.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  const s=1/scale();
  for(const id in mkNode) mkNode[id].setAttribute('r',Math.max(4.5*s,1.2));
  for(const id in hitNode) hitNode[id].setAttribute('r',Math.max(11*s,3));
  gLb.querySelectorAll('text').forEach(t=>{t.style.fontSize=(11*s)+'px';t.style.strokeWidth=(3*s)+'px';});
}
function fitTo(box,pad){
  const r=SVG.getBoundingClientRect();
  const ar=(r.width>0&&r.height>0)?r.width/r.height:MAP.w/MAP.h;   /* avant le 1er layout */
  pad=pad===undefined?.06:pad;
  let w=Math.max(box[2]-box[0],8), h=Math.max(box[3]-box[1],8);
  const cx=(box[0]+box[2])/2, cy=(box[1]+box[3])/2;
  w*=1+pad*2; h*=1+pad*2;
  if(w/h<ar) w=h*ar; else h=w/ar;
  vb={x:cx-w/2,y:cy-h/2,w,h}; applyVB();
}
function syncAspect(){
  const r=SVG.getBoundingClientRect(); if(!r.width||!r.height)return;
  const ar=r.width/r.height, cx=vb.x+vb.w/2, cy=vb.y+vb.h/2;
  vb.h=vb.w/ar; vb.x=cx-vb.w/2; vb.y=cy-vb.h/2; applyVB();
}
if(window.ResizeObserver) new ResizeObserver(()=>syncAspect()).observe(document.getElementById('stage'));
addEventListener('resize',()=>syncAspect());
function zoomAt(cx,cy,f){
  const nw=Math.min(Math.max(vb.w*f,25),MAP.w*1.6), nh=nw*(vb.h/vb.w);
  vb.x=cx-(cx-vb.x)*(nw/vb.w); vb.y=cy-(cy-vb.y)*(nh/vb.h); vb.w=nw; vb.h=nh; applyVB();
}
function toSvg(ev){
  const m=SVG.getScreenCTM(); if(!m) return {x:vb.x,y:vb.y};
  const p=new DOMPoint(ev.clientX,ev.clientY).matrixTransform(m.inverse());
  return {x:p.x,y:p.y};
}
function boxOf(ids){
  let b=[1e9,1e9,-1e9,-1e9];
  ids.forEach(id=>{const q=geo[id].b;
    b[0]=Math.min(b[0],q[0]);b[1]=Math.min(b[1],q[1]);b[2]=Math.max(b[2],q[2]);b[3]=Math.max(b[3],q[3]);});
  return b[0]>b[2]?[0,0,MAP.w,MAP.h]:b;
}
let savedVB=null;
const pushView=()=>{savedVB={x:vb.x,y:vb.y,w:vb.w,h:vb.h};};
const popView=()=>{if(savedVB){vb=savedVB;savedVB=null;applyVB();}};
function zoomOn(id,tight){
  const b=geo[id].b, pad=Math.max(tight?28:55,(b[2]-b[0])*1.1);
  fitTo([b[0]-pad,b[1]-pad,b[2]+pad,b[3]+pad],.05);
}
function fitCurrent(){
  if(S.screen==='select') fitTo([0,0,MAP.w,MAP.h],.01);
  else fitTo(boxOf(G.pool.map(p=>p.id)),.06);
}

SVG.addEventListener('wheel',e=>{e.preventDefault();const p=toSvg(e);
  zoomAt(p.x,p.y,Math.pow(1.0018,e.deltaY*(e.ctrlKey?3:1)));},{passive:false});
let drag=null,moved=0;
/* pincement à deux doigts : la page ne zoome pas sur la carte (touch-action:none),
   c'est donc à nous de gérer le geste */
const pts=new Map(); let pinch=null;
const spread=()=>{const a=[...pts.values()];
  return {d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),cx:(a[0].x+a[1].x)/2,cy:(a[0].y+a[1].y)/2};};
SVG.addEventListener('pointerdown',e=>{
  pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pts.size>=2){ drag=null; SVG.classList.remove('dragging');
    pinch={d:spread().d||1}; moved=99; TIP.style.display='none'; return; }
  drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y};moved=0;
  try{SVG.setPointerCapture(e.pointerId);}catch(_){} SVG.classList.add('dragging');});
SVG.addEventListener('pointermove',e=>{
  if(pts.has(e.pointerId)) pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&pts.size>=2){
    const s=spread(); if(!s.d)return;
    const m=SVG.getScreenCTM(); if(!m)return;
    const p=new DOMPoint(s.cx,s.cy).matrixTransform(m.inverse());
    zoomAt(p.x,p.y,pinch.d/s.d); pinch.d=s.d; return;
  }
  if(!drag){ hover(e); return; }
  const k=1/scale();
  moved=Math.max(moved,Math.hypot(e.clientX-drag.x,e.clientY-drag.y));
  vb.x=drag.vx-(e.clientX-drag.x)*k; vb.y=drag.vy-(e.clientY-drag.y)*k; applyVB();
});
SVG.addEventListener('pointerleave',()=>TIP.style.display='none');
const endPointer=e=>{
  pts.delete(e.pointerId); if(pts.size<2) pinch=null;
  SVG.classList.remove('dragging');
  if(drag&&moved<5){ try{SVG.releasePointerCapture(e.pointerId);}catch(_){} click(e); }
  drag=null;};
addEventListener('pointerup',endPointer);
addEventListener('pointercancel',endPointer);
SVG.addEventListener('dblclick',e=>{const p=toSvg(e);zoomAt(p.x,p.y,.55);});
document.getElementById('zIn').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,.65);
document.getElementById('zOut').onclick=()=>zoomAt(vb.x+vb.w/2,vb.y+vb.h/2,1.55);
document.getElementById('zFit').onclick=()=>fitCurrent();

/* quel pays sous le curseur ? */
function pickAt(e){
  const p=toSvg(e), dpt=new DOMPoint(p.x,p.y);
  const els=document.elementsFromPoint(e.clientX,e.clientY);
  let cand=els.filter(el=>el.tagName==='path'&&el.dataset.id&&node[el.dataset.id]);
  const inner=cand.filter(el=>{try{return el.isPointInFill(dpt);}catch(_){return false;}});
  cand=inner.length?inner:cand;
  if(cand.length){ cand.sort((a,b)=>DIAG(a.dataset.id)-DIAG(b.dataset.id)); return cand[0].dataset.id; }
  let best=null,bd=1e9;
  for(const id in hitNode){
    if(!hitNode[id].classList.contains('can')&&!hitNode[id].classList.contains('live'))continue;
    const c=geo[id].c, d=Math.hypot(c[0]-p.x,c[1]-p.y);
    if(d<bd){bd=d;best=id;}
  }
  if(best){const r=parseFloat(hitNode[best].getAttribute('r')||0); if(bd<=r*1.2) return best;}
  return null;
}

         locked:false,fin:false,etimer:null,tEnd:0};
const EXAM_MS=10000;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]];}return a;};
const fmt=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');

/* ================= progression par pays (Leitner, 5 boîtes) ================= */
const ST=load('stats',{});                       /* {id:{b:boîte 1-5, r:réussites, w:échecs, t:vu le}} */
const box=id=>ST[id]?ST[id].b:0;                 /* 0 = jamais rencontré */
function record(id,ok){
  const s=ST[id]||(ST[id]={b:1,r:0,w:0,t:0});
  const before=s.b;
  s.t=Date.now();
  if(ok){s.r++; s.b=Math.min(5,s.b+1);} else {s.w++; s.b=1;}
  store('stats',ST);
  return s.b>before;                             /* vrai = le pays a monté d'un cran */
}
/* file d'attente pondérée : d'abord le mal maîtrisé et le plus ancien */
function order(pool){
  if(!S.smart) return shuffle(pool.slice());
  const now=Date.now();
  return shuffle(pool.slice()).map(p=>{
    const s=ST[p.id], b=s?s.b:1;
    const jours=s&&s.t?Math.min((now-s.t)/864e5,30):30;
    return {p,u:(6-b)*12+jours+Math.random()*7};
  }).sort((a,b)=>b.u-a.u).map(x=>x.p);
}

const CONTS=[...new Set(PAYS.map(p=>p.cont))].sort((a,b)=>a.localeCompare(b,'fr'));

const answerOf=p=>needCap()?p.cap:p.nom;
const expected=c=>S.mode==='cont'?c.cont:answerOf(c);

/* --- QCM --- */
function optionsFor(c){
  if(S.mode==='cont'){
    const autres=shuffle(CONTS.filter(x=>x!==c.cont)).slice(0,3);
    return shuffle(autres.concat([c.cont])).map(x=>({txt:x,fg:'',ok:x===c.cont}));
  }
  return shuffle(makeOptions(c)).map(p=>({txt:answerOf(p),fg:S.mode==='name'?p.fg:'',ok:p===c}));
}
function makeOptions(c){
  const base=p=>p!==c&&(!needCap()||p.cap)&&answerOf(p)!==answerOf(c);
  const tiers=[G.pool.filter(p=>base(p)&&p.cont===c.cont),
               G.pool.filter(base),
               PAYS.filter(p=>base(p)&&p.cont===c.cont&&p.sov),
               PAYS.filter(p=>base(p)&&p.sov)];
  const pick=[], vus=new Set([answerOf(c)]);      /* jamais deux fois le même libellé */
  for(const t of tiers){
    for(const p of shuffle(t.slice())){
      if(pick.length>=3)break;
      if(vus.has(answerOf(p)))continue;
      vus.add(answerOf(p)); pick.push(p);
    }
  }
  return pick.slice(0,3).concat([c]);
}
function renderChoices(w,c){
  const box=document.createElement('div'); box.className='choices';
  optionsFor(c).forEach((o,i)=>{
    const b=document.createElement('button'); b.className='choice';
    b.dataset.ok=o.ok?'1':'';                     /* l'identité, pas le texte : Guinée ≠ Guinée-Bissau */
    b.innerHTML=`<kbd>${i+1}</kbd>${o.fg?`<span class="fg" aria-hidden="true">${o.fg}</span>`:''}<span>${o.txt}</span>`;
    b.onclick=()=>answer(b,box); box.appendChild(b);
  });
  w.appendChild(box);
}
function answer(btn,box){
  if(G.locked)return;
  const ok=btn.dataset.ok==='1';
  btn.classList.add(ok?'good':'wrong');
  [...box.children].forEach(b=>{ if(!ok&&b.dataset.ok==='1')b.classList.add('good'); b.disabled=true; });
  conclude(ok,ok?'✓ '+expected(G.cur)
    :'✗ '+(needCap()?G.cur.nom+' → '+G.cur.cap:'C’était '+expected(G.cur)));
}

/* --- saisie libre --- */
function lev(a,b){
  if(a===b)return 0;
  const m=a.length,n=b.length; if(!m||!n)return m||n;
  let prev=Array.from({length:n+1},(_,j)=>j),cur=new Array(n+1);
  for(let i=1;i<=m;i++){
    cur[0]=i;
    for(let j=1;j<=n;j++)
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev];
  }
  return prev[n];
}
function renderTyping(w,c){
  const wrap=document.createElement('div'); wrap.className='typing';
  const inp=document.createElement('input');
  inp.type='text'; inp.autocomplete='off'; inp.spellcheck=false; inp.enterKeyHint='go';
  inp.setAttribute('aria-label',needCap()?'Écris la capitale':'Écris le nom du pays');
  inp.placeholder=needCap()?'Capitale…':'Nom du pays…';
  const b=document.createElement('button'); b.className='btn primary'; b.textContent='Valider';
  const hint=document.createElement('div'); hint.className='hintbox';
  hint.textContent=expected(c).replace(/[^\s'’-]/g,'•');    /* gabarit : longueur seulement */
  b.onclick=()=>checkTyped(inp);
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){e.preventDefault();checkTyped(inp);} });
  wrap.appendChild(inp); wrap.appendChild(b); wrap.appendChild(hint);
  w.appendChild(wrap); setTimeout(()=>inp.focus(),30);
}
function checkTyped(inp){
  if(G.locked)return;
  const v=norm(inp.value.trim()); if(!v)return;
  const cible=norm(expected(G.cur));
  const sansArticle=cible.replace(/^(la|le|les|l')\s*/,'');
  const d=Math.min(lev(v,cible),lev(v,sansArticle));
  const ok=d===0||(cible.length>=7&&d<=1);        /* une faute de frappe tolérée sur les noms longs */
  inp.classList.add(ok?'good':'wrong'); inp.disabled=true;
  conclude(ok, ok?(d?'✓ '+expected(G.cur)+' — orthographe approchée':'✓ '+expected(G.cur))
                :'✗ '+expected(G.cur));
}

/* --- conclusion commune QCM / saisie / temps écoulé --- */
function conclude(ok,msg){
  G.locked=true; G.done++; stopExam();
  if(ok)G.score++; else G.miss.push(G.cur);
  if(record(G.cur.id,ok)&&ok) G.up.push(G.cur);
  say(msg,ok?'ok':'bad');
  $('sScore').textContent=G.score;
  const p=node[G.cur.id];
  if(p){ p.classList.remove('ask'); p.classList.add(ok?'ok':'bad');
    setTimeout(()=>p.classList.remove('ok','bad'),1200); }
  if(S.mode!=='name'){ pushView(); zoomOn(G.cur.id); }
  setTimeout(next, ok?700:1600);
}
function say(t,cls){const f=$('feedback');f.textContent=t;f.className=cls||'';}
function done(id){ const n=node[id]; n.dataset.state='done'; n.classList.remove('live','ask');
  n.removeAttribute('tabindex'); n.removeAttribute('role'); n.removeAttribute('aria-label');
  if(mkNode[id])mkNode[id].setAttribute('class','mk hid'); if(hitNode[id])hitNode[id].classList.remove('live'); }
function label(id,txt){
  const t=document.createElementNS(NS,'text');
  t.setAttribute('x',geo[id].c[0]); t.setAttribute('y',geo[id].c[1]+(TINY[id]?-7:3));
  t.setAttribute('class','lbl'); t.textContent=txt; gLb.appendChild(t); applyVB();
}
function onPlayClick(id){
  if(S.mode!=='place'||G.locked||G.fin)return;
  const n=node[id]; if(!n)return;
  if(!n.classList.contains('live')){
    if(G.pool.includes(BY[id])) say('Déjà trouvé — cherche '+G.cur.nom,'warn');
    return;
  }
  if(id===G.cur.id) good(); else wrong(id);
}
function good(){
  G.locked=true; G.done++; stopExam();
  const first=G.tries===0; if(first)G.score++; else G.miss.push(G.cur);
  if(record(G.cur.id,first)&&first) G.up.push(G.cur);
  done(G.cur.id); node[G.cur.id].classList.add(first?'ok':'half');
  label(G.cur.id,G.cur.nom);
  say('✓ '+G.cur.nom+(first?'':' (au 2ᵉ essai)'),first?'ok':'warn');
  $('sScore').textContent=G.score;
  setTimeout(next,first?420:700);
}
function wrong(id){
  G.tries++;
  const bad=node[id]; bad.classList.add('flash'); setTimeout(()=>bad.classList.remove('flash'),1000);
  if(S.exam||G.tries>=2) return reveal();          /* en examen : pas de seconde tentative */
  say('✗ Ça, c’est '+(BY[id]?BY[id].nom:'?')+'. Réessaie.','bad');
}
function reveal(auto){
  if(G.locked)return; G.locked=true; G.done++; stopExam(); G.miss.push(G.cur);
  record(G.cur.id,false);
  done(G.cur.id); node[G.cur.id].classList.add('bad');
  label(G.cur.id,G.cur.nom); pushView(); zoomOn(G.cur.id);
  say((auto?'⏱ Temps écoulé — ':'→ ')+G.cur.nom+' est ici','bad');
  setTimeout(next,1400);
}
/* --- chronomètre du mode examen --- */
function stopExam(){ clearInterval(G.etimer); G.etimer=null; $('ebar').parentNode.classList.remove('on'); }
function startExam(){
  stopExam(); if(!S.exam||G.fin)return;
  const bar=$('ebar'); bar.parentNode.classList.add('on'); bar.style.width='100%';

    if(reste<=0){ stopExam(); timeout(); }
  },80);
}
function timeout(){
  if(G.locked||G.fin)return;
  if(S.mode==='place') return reveal(true);
  document.querySelectorAll('.choice').forEach(b=>{ b.disabled=true; if(b.dataset.ok==='1')b.classList.add('good'); });
  const inp=document.querySelector('.typing input'); if(inp){inp.disabled=true;inp.classList.add('wrong');}

}

function finish(){

  const opts=[S.smart?'🧠 révision intelligente':'',S.typing?'⌨ saisie libre':'',S.exam?'⏱ examen':'']
    .filter(Boolean).join(' · ');
  $('ovCard').innerHTML=`
    <h2>${msg}${G.score}/${tot}</h2>
    <p class="sub">${MODE_NOM[S.mode]} · ${tot} pays${opts?' · '+opts:''}</p>
    <div class="score-big">${pct}%</div>
    <div class="grid3">
      <div class="kpi"><u>Temps</u><b>${fmt(secs)}</b></div>
      <div class="kpi"><u>Erreurs</u><b>${G.miss.length}</b></div>
      <div class="kpi"><u>Record</u><b>${recTxt}${rec?' 🏆':''}</b></div>
    </div>
    ${G.up.length?`<div class="miss"><h3>Progression (${G.up.length})</h3><ul>${
      G.up.map(p=>`<li class="up">${p.fg} ${p.nom} <span class="lvl">${lvlBars(box(p.id))}</span></li>`).join('')}</ul></div>`:''}
    ${G.miss.length?`<div class="miss"><h3>À revoir (${G.miss.length})</h3><ul>${
      G.miss.map(p=>`<li>${p.fg} ${p.nom}</li>`).join('')}</ul></div>`:''}
    <div class="row">
      <button class="btn primary" id="again">Rejouer</button>
      ${G.miss.length?'<button class="btn" id="redo">Refaire mes erreurs</button>':''}
      <button class="btn" id="seeMap">Voir la carte</button>
      <button class="btn" id="stats2">📊 Ma progression</button>
      <button class="btn" id="chg">Changer les pays</button>
    </div>
    <p class="note">Raccourcis : 1-4 pour répondre, Entrée pour rejouer.
    * Capitales au statut contesté ou partagé (Jérusalem, Ramallah).</p>`;
  G.endCard=$('ovCard').innerHTML;         /* pour revenir de la fiche progression sans tout recalculer */
  $('ov').classList.add('on'); bindEnd();
}
function bindEnd(){
  const miss=G.miss.slice();
  $('again').onclick=()=>start();
  $('seeMap').onclick=()=>$('ov').classList.remove('on');
  $('stats2').onclick=()=>statsCard();
  $('chg').onclick=()=>{$('ov').classList.remove('on');setScreen('select');};
  const rd=$('redo'); if(rd) rd.onclick=()=>replay(miss);
}
/* rejouer une liste donnée (erreurs de la partie) — même chemin que start() */
function replay(liste){
  if(!liste.length)return;
  $('ov').classList.remove('on');
  G.pool=liste; G.queue=order(liste);
  G.score=0;G.done=0;G.miss=[];G.up=[];G.locked=false;G.fin=false;
  gLb.innerHTML=''; paint();
  clearInterval(G.timer); G.t0=Date.now();
  G.timer=setInterval(()=>$('sTime').textContent=fmt((Date.now()-G.t0)/1000),250);
  $('sTime').textContent='0:00'; $('pbar').style.width='0%';
  fitTo(boxOf(liste.map(p=>p.id)),.06); next();
}

/* ================= fiches d'information ================= */
const lvlBars=b=>[1,2,3,4,5].map(i=>`<i class="${i<=b?'on':''}"></i>`).join('');
function alertCard(titre,html){
  $('ovCard').innerHTML=`<h2>${titre}</h2>${html}
    <div class="row"><button class="btn primary" id="okc">Fermer</button></div>`;
  $('ov').classList.add('on');
  $('okc').onclick=()=>{
    if(G.fin&&G.endCard){ $('ovCard').innerHTML=G.endCard; bindEnd(); return; }   /* retour à l'écran de fin */
    $('ov').classList.remove('on');
  };
}
function statsCard(){
  const vus=PAYS.filter(p=>ST[p.id])
    .sort((a,b)=>ST[a.id].b-ST[b.id].b||a.nom.localeCompare(b.nom,'fr'));
  if(!vus.length) return alertCard('Ma progression',
    '<p class="sub">Rien à afficher pour l’instant : termine une partie et ta progression apparaîtra ici, pays par pays.</p>');
  const maitrises=vus.filter(p=>ST[p.id].b>=4).length;
  const fragiles=vus.filter(p=>ST[p.id].b<=2).length;
  const rows=vus.map(p=>{const s=ST[p.id];
    return `<li class="st"><span>${p.fg} ${p.nom}</span><span class="lvl" aria-label="niveau ${s.b} sur 5">${lvlBars(s.b)}</span>
      <span class="tally">${s.r}✓ ${s.w}✗</span></li>`;}).join('');
  alertCard('Ma progression',`
    <p class="sub">Chaque bonne réponse fait monter un pays d’un cran, chaque erreur le renvoie au niveau 1.</p>
    <div class="grid3">
      <div class="kpi"><u>Pays rencontrés</u><b>${vus.length}</b></div>
      <div class="kpi"><u>Maîtrisés (4-5)</u><b>${maitrises}</b></div>
      <div class="kpi"><u>Fragiles (1-2)</u><b>${fragiles}</b></div>
    </div>
    <div class="miss"><h3>Du plus fragile au mieux su</h3><ul class="scroll">${rows}</ul></div>
    <p class="note">« ⚠ Mes points faibles » sélectionne directement les pays de niveau 1 et 2.
    « 🧠 Révision intelligente » les fait passer en premier dans la partie.</p>`);
}

/* ================= démarrage ================= */
S.terr=load('terr',false); $('bTerr').setAttribute('aria-pressed',S.terr);
S.smart=load('smart',false); S.typing=load('typing',false); S.exam=load('exam',false);
$('bSmart').setAttribute('aria-pressed',S.smart);
$('bType').setAttribute('aria-pressed',S.typing);
$('bExam').setAttribute('aria-pressed',S.exam);
S.mode=load('mode','place');
document.querySelectorAll('#modes button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.mode===S.mode));
const saved=load('sel',null);
S.sel=new Set((saved&&saved.length?saved:LISTE39).filter(id=>BY[id]));
setScreen('select');
$('ovCard').innerHTML=`
  <h2>GeoStudy</h2>
  <p class="sub">Choisis tes pays sur la carte du monde, puis révise-les.</p>
  <p style="margin:0 0 14px;font-size:13.5px;line-height:1.6">
    <b>1.</b> Clique les pays à étudier (ou utilise les boutons par continent, la recherche, ou ta liste des 39).<br>
    <b>2.</b> Choisis un mode : <b>Carte</b>, <b>Pays&nbsp;?</b>, <b>Drapeaux</b>, <b>Capitales</b>,
    <b>Drapeau→Capitale</b> ou <b>Continents</b>.<br>
    <b>3.</b> <b>Commencer</b> — la carte se recadre automatiquement sur ta sélection.</p>
  <p style="margin:-6px 0 14px;font-size:13px;line-height:1.6;color:var(--dim)">
    Trois options changent la façon de réviser : <b>🧠 Révision intelligente</b> fait revenir en premier
    les pays que tu rates, <b>⌨ Saisie libre</b> remplace le QCM par une réponse à écrire, et
    <b>⏱ Mode examen</b> laisse 10 secondes par question sans seconde chance.</p>
  <div class="grid3">
    <div class="kpi"><u>Pays souverains</u><b>${PAYS.filter(p=>p.sov).length}</b></div>
    <div class="kpi"><u>+ territoires</u><b>${PAYS.filter(p=>!p.sov).length}</b></div>
    <div class="kpi"><u>Sélection</u><b>${S.sel.size}</b></div>
  </div>
  <p class="note">Les micro-États (Monaco, Bahreïn, Singapour, Malte…) sont entourés d’un cercle et
  restent cliquables même dézoomés. Molette = zoom, glisser = déplacer, ⤢ = recadrer.
  Ta sélection est mémorisée d’une session à l’autre (stockage local, aucun cookie, aucune donnée envoyée).<br>
  <a href="/mentions-legales" style="color:var(--dim)">Mentions légales</a> · <a href="/confidentialite" style="color:var(--dim)">Confidentialité</a></p>
  <div class="row"><button class="btn primary" id="go">Choisir mes pays</button></div>`;
$('ov').classList.add('on');
$('go').onclick=()=>{$('ov').classList.remove('on');};
paint(); countSel(); fitTo([0,0,MAP.w,MAP.h],.01);

/* ================= hors ligne (PWA) ================= */
if('serviceWorker' in navigator&&location.protocol.startsWith('http'))
  navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
</body>
</html>
